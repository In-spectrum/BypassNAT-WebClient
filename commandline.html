<div id="commandLineOverlay" class="commandLineOverlay">

    <div id="commandLineWindow" class="commandLineWindow">

        <div class="commandLineTitle">
            Command line
        </div>

        <div class="commandLineBlackLine"></div>

        <div class="commandLineInputLabel">
            Input
        </div>

        <textarea
            id="commandLineInput"
            class="commandLineInput"
        ></textarea>

        <div class="commandLineRequestRow">
            <button
                id="btnCommandLineRequest"
                type="button"
            >
                Request
            </button>

            <button
                id="btnCommandLineKill"
                type="button"
            >
                Kill
            </button>
        </div>

        <div class="commandLineWhiteLine"></div>

        <div class="commandLineOutputHeader">

            <label>
                Output
            </label>

            <label class="commandLineCyrillic">
                <input
                    id="cbCommandLineCyrillic"
                    type="checkbox"
                >
                <span>use cirillic</span>
            </label>

        </div>

        <div class="commandLineOutputContainer">

            <textarea
                id="commandLineOutput"
                class="commandLineOutput"
                readonly
            ></textarea>

            <button
                id="btnCommandLineClear"
                class="commandLineClear"
                type="button"
            >
                Clear
            </button>

        </div>

        <div class="commandLineBottom">

            <div class="commandLineBlackLine"></div>

            <button
                id="btnCommandLineCancel"
                class="commandLineCancel"
                type="button"
            >
                Cancel
            </button>

        </div>

    </div>

</div>
