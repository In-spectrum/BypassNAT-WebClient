cd /каталог/твого/web-client
python3 -m http.server 8080

і відкрий:

http://127.0.0.1:8080/

<!DOCTYPE html>
<html lang="uk">


<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<link rel="stylesheet" href="css/style.css">


<title>Remote Client</title>


</head>



<body>


<div id="app">



<aside id="sidebar">



<div class="panelTitleBottom title">
    <div class="bannerContainer">
        <a href="https://in-spectrum.github.io/BypassNAT/" target="_blank" rel="noopener noreferrer">
            <img src="image/baner.png" alt="BypassNAT">
        </a>
        <span class="bannerBeta">(Beta)</span>
    </div>
</div>




<div class="panelBlock settingsSection isOpen">

<div class="blockTitle" role="button" tabindex="0" aria-expanded="true">
    <span class="blockArrow" aria-hidden="true">▶</span>
    <span class="blockTitleText">Server connection</span>
</div>

<div class="blockContent">

<div class="formGroup">
    <label for="txtServerPassword">
        Server Password
    </label>

    <div class="passwordInput">
        <input id="txtServerPassword" type="password">
        <button
            type="button"
            id="btnShowServerPassword"
        >👁</button>
    </div>
</div>



<div class="formGroup">
<label for="txtServerIP">
    Server IP
</label>
<input id="txtServerIP" type="text">
</div>



<div class="formGroup">
<label for="txtServerPort">
    Server Port
</label>
<input id="txtServerPort" type="number">
</div>


<div class="formGroup">
<label for="txtUserLogin">
    Login
</label>
<input id="txtUserLogin" type="text">
</div>



<div class="formGroup">
    <label for="txtUserPassword">
        Password
    </label>

    <div class="passwordInput">
        <input id="txtUserPassword" type="password">
        <button
            type="button"
            id="btnShowUserPassword"
        >👁</button>
    </div>
</div>




<div class="buttonRow">
    <button id="btnConnectServer">
        Server connect
    </button>
</div>

</div>

</div>



<div class="panelBlock settingsSection isOpen">



<div class="blockTitle" role="button" tabindex="0" aria-expanded="true">
    <span class="blockArrow" aria-hidden="true">▶</span>
    <span class="blockTitleText">Search devices</span>
</div>

<div class="blockContent">

<div class="deviceMode">

    <label class="checkboxOption">
        <input
            type="checkbox"
            id="cbScreenCapture"
        >
        <span>Screan capture</span>
    </label>

</div>

<div class="formGroup"; id="idTxtWebRTCPort"; style="margin-top: 20px;">
<label for="txtWebRTCPort">
    WebRTC Port (for video stream)
</label>
<input id="txtWebRTCPort" type="number">
</div>


<div class="formGroup">
<label for="txtFindClient"; style="margin-top: 20px;">
    Device Login
</label>


<input id="txtFindClient" type="text">


</div>




<div class="formGroup">


<label for="lstClients">
    Found devices
</label>


<select id="lstClients" size="6">
</select>


</div>




<div class="formGroup">


<div class="formGroup">
    <label for="txtClientPassword">
        Device Password
    </label>

    <div class="passwordInput">
        <input id="txtClientPassword" type="password">
        <button
            type="button"
            id="btnShowClientPassword"
        >👁</button>
    </div>
</div>


<div class="buttonRow">
    <label for="txtDeviceUse" style="display: inline-block; margin-top: 5px;">    
    </label>

    <label for="txtLogDeviceUse" style="display: inline-block; margin-top: 5px; margin-right: 5px; color: red;">    
    </label>

</div>


<div class="buttonRow">
    <button id="btnConnectClient">
        NEW connect
    </button>
</div>

</div>

</div>


    <div
        class="panelBlock settingsSection"
        id="fileCopySection"
    >
        <div
            class="blockTitle"
            id="fileCopyTitle"
            role="button"
            tabindex="0"
            aria-expanded="false"
        >
            <span
                class="blockArrow"
                aria-hidden="true"
            >▶</span>

            <span class="blockTitleText">
                File copy
            </span>
        </div>
    </div>

<div
    class="fileCopyBottomBarrier settingsSection"
    aria-hidden="true"
>
</div>

</aside>





<main id="main">


<button id="btnOpen">
❮
</button>



<div id="playerArea" tabindex="0">


<video id="video" autoplay playsinline></video>


<div id="connectionStatus">

    <div id="serverConnectionText">
        Server connecting...
    </div>

    <div id="connectionStatusIndicator"></div>

    <div id="connectionStatusDevice"></div>

    <div id="deviceConnectionText">
        Device connecting...
    </div>

    <div id="clipboardRiadWrite">
        Clipboard...
    </div>

</div>


</div>



</main>


<!-- Кнопка відкриття / закриття логів -->
<button id="btnLogger">
    ❯
</button>




<footer id="logger">


    <div id="loggerHeader">


        <span>
            Логи
        </span>


        <button id="btnClear">
            Очистити
        </button>


    </div>


    <div id="loggerBody"></div>


</footer>



</div>



<script src="js/protocol.js"></script>
<script src="js/state.js"></script>
<script src="js/parserdata.js"></script>
<script src="js/websocket.js"></script>
<script src="js/reader.js"></script>
<script src="js/player.js"></script>
<script src="js/mouse.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/filecopy.js"></script>
<script src="js/app.js"></script>


</body>


</html>
