<!DOCTYPE html>
<html lang="uk">


<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<link rel="stylesheet" href="css/style.css">


<title>Remote Client</title>


</head>



<body>


<div id="app">



<aside id="sidebar">



<div class="title">
    <span>Settings</span>
</div>




<div class="panelBlock">



<div class="blockTitle">
    Server connection
</div>



<div class="formGroup">
    <label for="txtServerPassword">
        Server Password
    </label>

    <div class="passwordInput">
        <input id="txtServerPassword" type="password">
        <button
            type="button"
            id="btnShowServerPassword"
        >👁</button>
    </div>
</div>



<div class="formGroup">
<label for="txtServerIP">
    Server IP
</label>
<input id="txtServerIP" type="text">
</div>



<div class="formGroup">
<label for="txtServerPort">
    Server Port
</label>
<input id="txtServerPort" type="number">
</div>


<div class="formGroup">
<label for="txtUserLogin">
    Login
</label>
<input id="txtUserLogin" type="text">
</div>



<div class="formGroup">
    <label for="txtUserPassword">
        Password
    </label>

    <div class="passwordInput">
        <input id="txtUserPassword" type="password">
        <button
            type="button"
            id="btnShowUserPassword"
        >👁</button>
    </div>
</div>




<div class="buttonRow">
<button id="btnConnectServer">
    Server connect
</button>
</div>



</div>





<div class="panelBlock">



<div class="blockTitle">
    Search devices
</div>

<div class="formGroup">
<label for="txtWebRTCPort">
    WebRTC Port - for video stream
</label>
<input id="txtWebRTCPort" type="number">
</div>



<div class="formGroup">


<label for="txtFindClient">
    Device Login
</label>


<input id="txtFindClient" type="text">


</div>




<div class="formGroup">


<label for="lstClients">
    Found devices
</label>


<select id="lstClients" size="6">
</select>


</div>




<div class="formGroup">


<div class="formGroup">
    <label for="txtClientPassword">
        Device Password
    </label>

    <div class="passwordInput">
        <input id="txtClientPassword" type="password">
        <button
            type="button"
            id="btnShowClientPassword"
        >👁</button>
    </div>
</div>




<div class="buttonRow">

    <button id="btnConnectClient">
        NEW connect
    </button>

    <button id="btnDisConnectClient">
        Disconnect
    </button>

</div>



</div>



</aside>





<main id="main">


<button id="btnOpen">
❮
</button>



<div id="playerArea" tabindex="0">


<video id="video" autoplay playsinline></video>


<div id="connectionStatus">

    <div id="serverConnectionText">
        Server connecting...
    </div>

    <div id="connectionStatusIndicator"></div>

    <div id="connectionStatusDevice"></div>

    <div id="deviceConnectionText">
        Device connecting...
    </div>

</div>


</div>



</main>


<!-- Кнопка відкриття / закриття логів -->
<button id="btnLogger">
    ❯
</button>




<footer id="logger">


    <div id="loggerHeader">


        <span>
            Логи
        </span>


        <button id="btnClear">
            Очистити
        </button>


    </div>


    <div id="loggerBody"></div>


</footer>



</div>



<script src="js/protocol.js"></script>
<script src="js/state.js"></script>
<script src="js/parserdata.js"></script>
<script src="js/websocket.js"></script>
<script src="js/reader.js"></script>
<script src="js/player.js"></script>
<script src="js/mouse.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/app.js"></script>


</body>


</html>
